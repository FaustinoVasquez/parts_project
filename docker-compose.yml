
services:
  nginx:
    image: nginx:latest
    ports:
      - 8080:80
      - 8443:443
    depends_on:
      - php
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/conf/fastcgi.conf:/etc/nginx/fastcgi.conf:ro
      - ./parts:/var/www/
      - ./logs/nginx:/var/log/nginx
      - "/home/fvasquez/mitechnologies wildcard ssl:/etc/nginx/ssl:ro"
    networks:
      - app-network
    restart: always
    
  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www
    volumes:
      - ./parts:/var/www
      - ./logs/php:/var/log/php-fpm
      # - ./parts/.env:/var/www/.env
    networks:
      - app-network
    command: ["php-fpm", "-F"]

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
    networks:
      - app-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local